spring:
    application:
        name: category-service
    data:
        mongodb:
            uri: "${MONGO_URI}"

server:
    port: 9000

eureka:
    client:
        serviceUrl:
            defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
        fetchRegistry: true
        registerWithEureka: true
    instance:
        preferIpAddress: true