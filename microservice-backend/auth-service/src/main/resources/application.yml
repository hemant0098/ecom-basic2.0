spring:
    application:
        name: auth-service
    data:
        mongodb:
            uri: "${MONGO_URI}"
    

server:
    port: 9030

eureka:
    client:
        serviceUrl:
            defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
    instance:
        preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always