apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: ecom-basic

spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecom-frontend
            port:
              number: 80

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: service-registry
            port:
              number: 8761