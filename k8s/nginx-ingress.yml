apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: ecom-basic
  anootations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecom-frontend
            port:
              number: 80

      - path: /eureka
        pathType: Prefix
        backend:
          service:
            name: service-registry
            port:
              number: 8761

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 8081
      
      - path: /mailpit
        pathType: Prefix
        backend:
          service:
            name: mailpit-service
            port:
              number: 8025

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-service
  namespace: ecom-basic
spec:
  type: NodePort
  selector:
    app: nginx-ingress
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30008