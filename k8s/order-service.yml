apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom-basic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: hemantdevgan/order-service:v1.0
        ports:
        - containerPort: 9070
        env:
        - name: EUREKA_URL
          value: "http://service-registry:8761/eureka/"
        - name: MONGO_URI
          value: "mongodb://admin:hemant0098@mongodb:27017/orderdb?authSource=admin"

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecom-basic
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - port: 9070
    targetPort: 9070