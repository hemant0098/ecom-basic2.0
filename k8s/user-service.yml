apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecom-basic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: hemantdevgan/user-service:v1.0
        ports:
        - containerPort: 9050
        env:
        - name: EUREKA_URL
          value: http://service-registry:8761/eureka/
        - name: MONGO_URI
          value: "mongodb://admin:hemant0098@mongodb:27017/userdb?authSource=admin"

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecom-basic
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
  - port: 9050
    targetPort: 9050