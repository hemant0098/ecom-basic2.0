apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecom-basic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: hemantdevgan/notification-service:v1.0
        ports:
        - containerPort: 9010
        env:
        - name: MAIL_HOSTNAME
          value: "mailpit"
        - name: MAIL_PORT
          value: "1025"
        - name: EUREKA_URL
          value: http://service-registry:8761/eureka/
        - name: MONGO_URI
          value: "mongodb://admin:hemant0098@mongodb:27017/notificationdb?authSource=admin"

---

apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecom-basic
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - port: 9010
    targetPort: 9010