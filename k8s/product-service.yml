apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom-basic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: hemantdevgan/product-service:v1.0
        ports:
        - containerPort: 9060
        env:
        - name: EUREKA_URL
          value: http://service-registry:8761/eureka/
        - name: MONGO_URI
          value: "mongodb://admin:hemant0098@mongodb:27017/productdb?authSource=admin"

---

apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecom-basic
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
  - port: 9060
    targetPort: 9060