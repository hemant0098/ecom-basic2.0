apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: ecom-basic
spec:
  replicas: 1
  selector:
    matchLabels:
        app: eureka-app
  template:
    metadata:
      labels:
        app: eureka-app
    spec:
      containers:
      - name: eureka-app
        image: hemantdevgan/eureka-service:v1.0
        ports:
        - containerPort: 8761
          

---

apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: ecom-basic
spec:
  type: LoadBalancer
  selector:
    app: eureka-app
  ports:
  - port: 8761
    targetPort: 8761
    
  