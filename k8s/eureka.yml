apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: ecom-basic
spec:
  replicas: 1
  selector:
    matchLabels:
      labels:
        app: eureka-app
  template:
    metadata:
      labels:
        app: eureka-app
    spec:
      containers:
      - name: eureka-app
        image: hemantdevgan/eureka-app:v1
        ports:
        - containerPort: 8761
          

---

apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: ecom-basic
spec:
  type: NodePort
  selector:
    app: eureka-app
  ports:
  - containerPort: 8761
    hostPort: 8761
    nodePort: 30000
  