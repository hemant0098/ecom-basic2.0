
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: ecom-basic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017
          env:
          - name: MONGO_ROOT_USERNAME
            value: "admin"
          - name: MONGO_ROOT_PASSWORD
            value: "hemant0098"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: ecom-basic
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
