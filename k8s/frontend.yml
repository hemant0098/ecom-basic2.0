apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-frontend
  namespace: ecom-basic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-frontend
  template:
    metadata:
      labels:
        app: ecom-frontend
    spec:
      containers:
      - name: ecom-frontend
        image: hemantdevgan/frontend-service:v2.0
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend
  namespace: ecom-basic
spec:
  type: ClusterIP
  selector:
    app: ecom-frontend
  ports:
  - port: 80
    targetPort: 80
