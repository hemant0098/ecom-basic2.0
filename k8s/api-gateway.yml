apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom-basic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: hemantdevgan/api-gateway:v1.0
        ports:
        - containerPort: 8081
        env:
        - name: EUREKA_URL
          value: http://service-registry:8761/eureka/
  
---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: ecom-basic
spec:
  type: LoadBalancer
  selector:
    app: api-service
  ports:
  - port: 8081
    targetPort: 8081